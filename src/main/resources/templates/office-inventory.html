<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(#{office.inventory})}"></head>
<body><header th:replace="~{layout/nav :: nav}"></header><main class="container page-shell"><section class="panel"><div class="section-header"><div><p class="eyebrow" th:text="${office.name}">Office</p><h1 th:text="#{office.inventory}">Found Inventory</h1></div><a class="btn" th:href="@{/office/found/new}" th:text="#{office.addFound}">Add Found Item</a></div><div class="table-wrap"><table><thead><tr><th th:text="#{item.name}">Item</th><th th:text="#{item.category}">Category</th><th th:text="#{item.color}">Color</th><th th:text="#{office.foundArea}">Area</th><th th:text="#{office.storage}">Storage</th><th th:text="#{item.status}">Status</th><th></th></tr></thead><tbody><tr th:each="item : ${inventory}"><td th:text="${item.itemName}">Item</td><td th:text="#{${'category.' + item.category}}">Category</td><td th:text="#{${'color.' + item.color}}">Color</td><td th:text="${item.foundArea}">Area</td><td th:text="${item.storageReference}">Storage</td><td><span th:class="'badge ' + ${item.status}" th:text="#{${'foundStatus.' + item.status.name()}}">Status</span></td><td><div class="actions compact-actions"><a class="btn btn-secondary btn-sm" th:href="@{'/office/inventory/' + ${item.id} + '/edit'}" th:text="#{office.editFound}">Edit</a><form method="post" th:action="@{'/office/inventory/' + ${item.id} + '/delete'}" th:attr="onsubmit=|return confirm('#{delete.confirmInventory}');|"><button class="btn-danger btn-sm" type="submit" th:text="#{delete.button}">Delete</button></form></div></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(inventory)}" th:text="#{office.emptyInventory}">No inventory.</div></section></main><footer th:replace="~{layout/footer :: footer}"></footer></body></html>
