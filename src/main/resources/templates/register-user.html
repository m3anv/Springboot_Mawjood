<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(#{auth.user.title})}"></head>
<body><header th:replace="~{layout/nav :: nav}"></header>
<main class="container page-shell"><section class="auth-layout"><aside class="auth-aside"><p class="eyebrow" th:text="#{auth.user.eyebrow}">Create account</p><h1 th:text="#{auth.user.title}">User Registration</h1><p class="help-text" th:text="#{auth.user.text}">Create a personal account to submit lost reports and track official updates.</p></aside><div class="panel"><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/register/user}"><div class="field"><label for="name" th:text="#{auth.fullName}">Full name</label><input id="name" name="name" th:value="${name}" required></div><div class="field"><label for="email" th:text="#{auth.email}">Email</label><input id="email" type="email" name="email" th:value="${email}" required></div><div class="field"><label for="password" th:text="#{auth.password}">Password</label><input id="password" type="password" name="password" minlength="6" required></div><button type="submit" th:text="#{auth.createAccount}">Create Account</button></form><div class="actions"><span th:text="#{auth.haveAccount}">Already have an account?</span><a th:href="@{/login}" th:text="#{nav.login}">Login</a></div></div></section></main>
<footer th:replace="~{layout/footer :: footer}"></footer></body></html>
