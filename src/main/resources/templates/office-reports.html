<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(#{office.lostQueue})}"></head>
<body><header th:replace="~{layout/nav :: nav}"></header>
<main class="container page-shell"><section class="panel"><div class="section-header"><div><p class="eyebrow" th:text="${office.location.name}">Location</p><h1 th:text="#{office.lostQueue}">Lost Reports Queue</h1></div></div><div class="table-wrap"><table><thead><tr><th th:text="#{item.name}">Item</th><th th:text="#{item.location}">Area</th><th th:text="#{item.contact}">Contact</th><th th:text="#{item.status}">Status</th><th></th></tr></thead><tbody><tr th:each="report : ${reports}"><td th:text="${report.itemName}">Item</td><td th:text="${report.lostArea}">Area</td><td th:text="${report.contactInfo}">Contact</td><td><span th:class="'badge ' + ${report.status}" th:text="#{${'reportStatus.' + report.status.name()}}">Status</span></td><td><div class="actions compact-actions"><a class="btn btn-secondary btn-sm" th:href="@{'/office/reports/' + ${report.id}}" th:text="#{item.viewDetails}">Open</a><form method="post" th:action="@{'/office/reports/' + ${report.id} + '/delete'}" th:attr="onsubmit=|return confirm('#{delete.confirmReport}');|"><button class="btn-danger btn-sm" type="submit" th:text="#{delete.button}">Delete</button></form></div></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(reports)}" th:text="#{office.emptyReports}">No reports.</div></section></main>
<footer th:replace="~{layout/footer :: footer}"></footer></body></html>
