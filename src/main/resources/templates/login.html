<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(#{auth.login.title})}"></head>
<body><header th:replace="~{layout/nav :: nav}"></header>
<main class="container page-shell"><section class="auth-layout"><aside class="auth-aside"><p class="eyebrow" th:text="#{auth.login.eyebrow}">Welcome back</p><h1 th:text="#{auth.login.title}">Login</h1><p class="help-text" th:text="#{auth.login.text}">Users track reports. Office users manage location cases.</p></aside><div class="panel"><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><form method="post" th:action="@{/login}"><div class="field"><label for="email" th:text="#{auth.email}">Email</label><input id="email" type="email" name="email" th:value="${email}" required></div><div class="field"><label for="password" th:text="#{auth.password}">Password</label><input id="password" type="password" name="password" required></div><button type="submit" th:text="#{auth.login.button}">Login</button></form><div class="actions"><span th:text="#{auth.new}">New?</span><a th:href="@{/register/user}" th:text="#{auth.createUser}">Create account</a></div><p class="help-text" th:text="#{auth.officeHint}">Office accounts are issued by the platform admin.</p></div></section></main>
<footer th:replace="~{layout/footer :: footer}"></footer></body></html>
